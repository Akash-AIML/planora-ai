# SonarQube / SonarCloud Project Configuration
sonar.projectKey=Akash-AIML_planora-ai
sonar.organization=akash-aiml
sonar.projectName=planora-ai

# Source & Test Code Structure
sonar.sources=src
sonar.tests=src/lib/domain/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/*.config.*,**/docs/**

# Test Coverage & Execution Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
